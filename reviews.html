<title>Reviews | B eleven Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#04030f;--v2:#5b34e0;--lt:#f3f0ff;--lt-tx:#14102e;--mu:#b9b3dd;--mu-lt:#5d5780;--star:#f5b301;
--grad:linear-gradient(135deg,#b79cff 0%,#6a3df0 50%,#2f6bff 100%);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,Cairo,sans-serif;font-size:16px;line-height:1.7;color:#fff;overflow-x:hidden;
 background:linear-gradient(160deg,#171049 0%,#2a2279 55%,#3a2da3 100%) fixed;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #b79cff;outline-offset:3px}
html[lang=ar] body{font-family:Cairo,Inter,sans-serif}
html[lang=ar] h1,html[lang=ar] h2{letter-spacing:0}

.panel{position:relative;max-width:1500px;margin:0 auto 16px;border-radius:36px;overflow:hidden}
.dark{background:var(--ink);color:#fff}
.light{background:var(--lt);color:var(--lt-tx)}
.in{max-width:1120px;margin:0 auto;padding:80px 24px}
h1,h2{margin:0 0 12px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,4.2rem)}
h2{font-size:clamp(1.7rem,4vw,2.6rem)}
.lead{margin:0 0 36px;max-width:38em;color:var(--mu)}
.light .lead{color:var(--mu-lt)}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 14px;border-radius:99px;margin-bottom:16px;background:rgba(124,92,255,.16);color:#b79cff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;padding:12px 28px;font-weight:600;border:0;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px)}
.btn-w{background:#fff;color:#0d0830}
.btn-w:hover{box-shadow:0 6px 30px rgba(255,255,255,.45)}
.btn-d{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn-d:hover{background:rgba(255,255,255,.16)}
.btn-g{background:var(--grad);color:#fff}
.btn-g:hover{box-shadow:0 10px 30px rgba(91,52,224,.45)}
.btn[disabled]{opacity:.6;pointer-events:none}

/* header */
.hero{background:radial-gradient(ellipse 55% 45% at 50% 40%,rgba(47,35,170,.55),transparent 70%),var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 40px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem}
.brand img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 18px rgba(124,58,237,.65)}
.links{display:flex;gap:30px;font-size:.95rem;color:#dcd7ff}
.links a:hover{color:#fff}
.act{display:flex;gap:10px;align-items:center}
.act .btn{padding:9px 22px;font-size:.9rem}
.hero-in{text-align:center;padding:40px 20px 90px;display:flex;flex-direction:column;align-items:center}
.hero-in h1{background:linear-gradient(180deg,#fff 40%,#d9ccff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-in .lead{margin:6px auto 26px}
.sum{display:inline-flex;align-items:center;gap:14px;padding:10px 22px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);margin-bottom:28px}
.sum b{font-size:1.5rem;line-height:1}
.sum span{color:var(--mu);font-size:.92rem}

/* stars */
.stars{display:inline-flex;gap:3px;direction:ltr;color:var(--star);vertical-align:middle}
.stars svg{width:20px;height:20px;fill:currentColor}
.stars .off{color:rgba(120,100,200,.28)}
.dark .stars .off{color:rgba(255,255,255,.22)}

/* reviews */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.rcard{background:#fff;border-radius:24px;padding:26px;box-shadow:0 8px 30px rgba(60,40,140,.08);display:flex;flex-direction:column;gap:14px;transition:transform .35s,box-shadow .35s}
.rcard:hover{transform:translateY(-5px);box-shadow:0 18px 44px rgba(91,52,224,.18)}
.rcard blockquote{margin:0;line-height:1.7;flex:1;overflow-wrap:anywhere}
.rcard .who{font-weight:700}
.rcard .who small{display:block;font-weight:400;color:var(--mu-lt)}
.empty{text-align:center;color:var(--mu-lt);padding:20px 0}

/* form */
.formbox{max-width:640px;margin:0 auto}
.formbox .lead{margin-bottom:28px}
.field{display:block;margin-bottom:18px}
.field>span,legend{display:block;font-weight:600;font-size:.92rem;margin-bottom:8px;padding:0}
.field em{font-style:normal;color:var(--mu);font-weight:400}
input[type=text],textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);transition:border-color .2s,background .2s}
input[type=text]::placeholder,textarea::placeholder{color:rgba(185,179,221,.6)}
input[type=text]:focus,textarea:focus{outline:none;border-color:#b79cff;background:rgba(255,255,255,.1)}
textarea{min-height:140px;resize:vertical}
fieldset{border:0;margin:0 0 18px;padding:0;min-width:0}
.rate{position:relative;display:inline-flex;flex-direction:row-reverse;direction:ltr;gap:6px}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{cursor:pointer;color:rgba(255,255,255,.25);transition:color .15s,transform .15s;line-height:0}
.rate label svg{width:38px;height:38px;fill:currentColor}
.rate label:hover{transform:scale(1.12)}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--star)}
.rate input:focus-visible+label{outline:2px solid #b79cff;outline-offset:2px;border-radius:8px}
.msg{margin:0 0 16px;padding:12px 16px;border-radius:14px;font-size:.93rem}
.msg.err{background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.4);color:#ffd0d6}
.msg.err a{text-decoration:underline}
.thanks{text-align:center;padding:30px 10px}
.thanks .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--grad)}
.thanks .tick svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.thanks h2{font-size:1.7rem}
.thanks p{color:var(--mu);margin:0 0 22px}
[hidden]{display:none!important}

/* footer */
.ft .in{padding:40px 24px;text-align:center;color:var(--mu);font-size:.9rem}
.ft .row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ft .row a:hover{color:#fff}

@media(max-width:700px){
 body{padding:8px}.panel{border-radius:26px;margin-bottom:8px}
 .nav{padding:20px}.links{display:none}
 .in{padding:56px 18px}
 .hero-in{padding-bottom:64px}
 .rate label svg{width:42px;height:42px}
}
@media(max-width:480px){
 body{padding:6px}
 .panel{border-radius:20px;margin-bottom:6px}
 .nav{padding:14px;gap:8px;flex-wrap:wrap}
 .brand{gap:8px;font-size:.88rem;letter-spacing:.08em}
 .brand img{width:32px;height:32px}
 .act{gap:6px;margin-inline-start:auto}
 .act .btn{padding:8px 12px;font-size:.8rem}
 .hero-in{padding:28px 14px 48px}
 .sum{max-width:100%;gap:8px;padding:9px 12px;flex-wrap:wrap;justify-content:center}
 .sum span{font-size:.82rem}
 .in{padding:42px 14px}
 .grid{grid-template-columns:minmax(0,1fr);gap:14px}
 .rcard{padding:22px;border-radius:20px}
 .formbox{width:100%}
 input[type=text],textarea{font-size:16px}
 .rate{gap:4px}
 .rate label svg{width:38px;height:38px}
 .formbox .btn{width:100%}
 .ft .in{padding:30px 14px}
 .ft .row{gap:12px 18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  sum.hidden=false;
 }else sum.hidden=true;
}

function apply(){
 var h=document.documentElement;h.lang=L;h.dir=L==="ar"?"rtl":"ltr";
 $$("[data-t]").forEach(function(el){var v=T[L][el.getAttribute("data-t")];if(v!=null)el.textContent=v});
 $$("[data-tp]").forEach(function(el){var v=T[L][el.getAttribute("data-tp")];if(v!=null)el.placeholder=v});
 document.title=(L==="ar"?"التقييمات":"Reviews")+" | B eleven Digital";
 $("#lang").textContent=L==="ar"?"English":"العربية";
 $("#lang-field").value=L;
 renderReviews();
}
$("#lang").addEventListener("click",function(){L=L==="ar"?"en":"ar";try{localStorage.setItem("lx-lang-v2",L)}catch(e){}apply()});

/* form */
var form=$("#rf"),err=$("#err"),send=$("#send");
function showErr(html,isHTML){if(isHTML)err.innerHTML=html;else err.textContent=html;err.hidden=false}
form.addEventListener("submit",function(e){
 e.preventDefault();err.hidden=true;
 var name=$("#f-name").value.trim(),msg=$("#f-msg").value.trim(),r=form.querySelector("input[name=rating]:checked");
 if(!name){showErr(T[L].e_name);$("#f-name").focus();return}
 if(!r){showErr(T[L].e_rate);return}
 if(msg.length<10){showErr(T[L].e_msg);$("#f-msg").focus();return}
 send.disabled=true;var old=send.textContent;send.textContent=T[L].sending;
 var body=new URLSearchParams(new FormData(form)).toString();
 fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body})
  .then(function(res){
   if(!res.ok)throw new Error("bad status");
   $("#formwrap").hidden=true;$("#thanks").hidden=false;form.reset();
   $("#add").scrollIntoView({behavior:"smooth",block:"start"});
  })
  .catch(function(){
   err.textContent=T[L].e_send+" ";
   var a=document.createElement("a");a.href="https://wa.me/201108260667";a.target="_blank";a.rel="noopener";a.textContent=T[L].wa;
   err.appendChild(a);err.hidden=false;
  })
  .then(function(){send.disabled=false;send.textContent=T[L].f_send});
});
$("#again").addEventListener("click",function(){$("#thanks").hidden=true;$("#formwrap").hidden=false});

$("#yr").textContent=new Date().getFullYear();
apply();
})();
</script>
